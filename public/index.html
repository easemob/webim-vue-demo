<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <!-- 早于 webpack 注入的 dev-client 注册，保留 SDK 空引用错误的 Console 上下文。 -->
    <script>
      (function () {
        function nullishPropMsg(m) {
          return (
            typeof m === 'string' &&
            (m.indexOf('Cannot read properties of null') !== -1 ||
              m.indexOf('Cannot read properties of undefined') !== -1 ||
              m.indexOf("Cannot read property '") !== -1)
          );
        }
        function sdkStack(x) {
          var s = (x && x.stack) || '';
          return typeof s === 'string' && s.indexOf('easemob-websdk') !== -1;
        }
        window.addEventListener(
          'error',
          function (ev) {
            var err = ev.error;
            var msg = (err && err.message) || ev.message || '';
            var fn = ev.filename || '';
            if (
              nullishPropMsg(msg) &&
              (sdkStack(err) || fn.indexOf('easemob-websdk') !== -1)
            ) {
              console.error('[IM SDK preload] 空引用（已拦截 overlay）', err || msg);
              if (err && err.stack) console.error(err.stack);
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
            }
          },
          true,
        );
        window.addEventListener(
          'unhandledrejection',
          function (ev) {
            var r = ev.reason;
            var msg = (r && r.message) || '';
            if (nullishPropMsg(msg) && sdkStack(r)) {
              console.error('[IM SDK preload] 未处理拒绝（已拦截 overlay）', r);
              ev.preventDefault();
              ev.stopPropagation();
              ev.stopImmediatePropagation();
            }
          },
          true,
        );
      })();
    </script>
  </head>

  <body>
    <noscript>
      <strong
        >We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work
        properly without JavaScript enabled. Please enable it to
        continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
